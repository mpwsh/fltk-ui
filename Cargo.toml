[package]
name = "ui"
version = "0.1.0"
edition = "2024"
description = "Shared FLTK widgets and theming for voice-chat-core examples and client"

[dependencies]
fltk = { version = "1.5", features = ["fltk-bundled"] }
fltk-theme = "0.7"

[lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
redundant_clone = { level = "deny", priority = 9 }
